name: Publish

# Publishing is driven by tags, one package per tag, the same scheme as
# shaharia-lab/design-system:
#
#   git tag site-kit@0.1.0 && git push origin site-kit@0.1.0
#
# The part before the "@" is the directory under packages/; the part after is
# the version, which must already match that package.json. Nothing is published
# on a push to main.
#
# Authentication is npm trusted publishing: the job's OIDC identity is
# exchanged for a short-lived, package-scoped credential, so there is no
# NPM_TOKEN and nothing long-lived to leak or rotate. It needs a trusted
# publisher on the npm package pointing at this repo, this workflow file and
# the npm-publish environment. Provenance comes from the same identity.
#
# Actions are pinned to full commit SHAs (org rule sha_pinning_required).
on:
  push:
    tags:
      - '*@*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Directory under packages/ to publish (e.g. site-kit)'
        required: true
        type: string
      dry_run:
        description: 'Pack and inspect only; do not publish to npm'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          scope: '@shaharia-lab'
          package-manager-cache: false # never cache in release builds

      # Trusted publishing (OIDC) requires npm >= 11.5.1.
      - name: Ensure recent npm
        run: npm install -g npm@latest

      - name: Resolve package and version from the tag
        id: target
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            dir='${{ inputs.package }}'
            tag_version=''
          else
            tag="${GITHUB_REF_NAME}"
            dir="${tag%@*}"
            tag_version="${tag##*@}"
          fi

          pkg="packages/${dir}"
          if [ ! -f "${pkg}/package.json" ]; then
            echo "::error::No package.json in '${pkg}/'; the tag prefix must be a directory under packages/."
            exit 1
          fi

          pkg_version="$(node -p "require('./${pkg}/package.json').version")"
          if [ -n "${tag_version}" ] && [ "${tag_version}" != "${pkg_version}" ]; then
            echo "::error::Tag version '${tag_version}' does not match ${pkg}/package.json version '${pkg_version}'."
            exit 1
          fi

          {
            echo "dir=${pkg}"
            echo "version=${pkg_version}"
            echo "name=$(node -p "require('./${pkg}/package.json').name")"
          } >> "$GITHUB_OUTPUT"

      # Never publish something that does not pass the same gates as CI.
      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Inspect the tarball
        working-directory: ${{ steps.target.outputs.dir }}
        run: npm pack --dry-run

      - name: Publish to npm
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        working-directory: ${{ steps.target.outputs.dir }}
        run: npm publish --access public

      - name: Summary
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run only: \`${{ steps.target.outputs.name }}@${{ steps.target.outputs.version }}\` was packed but not published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published \`${{ steps.target.outputs.name }}@${{ steps.target.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
