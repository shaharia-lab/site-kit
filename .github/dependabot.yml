version: 2
updates:
  # Astro, Starlight and the community plugins move together, so their bumps
  # arrive as one PR that CI can prove against the demo build.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*', 'starlight-*']
      fonts:
        patterns: ['@fontsource/*', '@fontsource-variable/*']
      dev:
        dependency-type: development
    ignore:
      # astro check refuses TypeScript 7 ("does not currently support
      # TypeScript 7.0"). Hold at 6.x until @astrojs/check supports it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
